<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b46"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="SiFa Manager"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>SiFa Manager</title>
<style>
:root{--navy:#102b46;--blue:#20577f;--green:#16845b;--bg:#f2f5f8;--line:#d9e1e8;--ink:#1b2935;--muted:#657789;--red:#a83232;--amber:#966000}*{box-sizing:border-box}body{margin:0;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--navy);color:white;padding:16px 18px;position:sticky;top:0;z-index:5}header h1{font-size:21px;margin:0 0 3px}header small{opacity:.8}nav{display:flex;gap:7px;overflow:auto;padding:9px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:61px;z-index:4}nav button,.btn{border:0;border-radius:8px;padding:10px 12px;background:#e8eef3;color:var(--navy);font-weight:650;white-space:nowrap;cursor:pointer}nav button.active,.primary{background:var(--blue);color:white}main{max-width:1250px;margin:auto;padding:16px}.panel{display:none}.panel.active{display:block}h2{font-size:21px;margin:8px 0 14px}h3{margin:0 0 9px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:12px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 2px 8px #102b460c}.metric{font-size:28px;font-weight:750;color:var(--blue)}.muted{color:var(--muted);font-size:13px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 12px}label{display:block;font-weight:650;font-size:13px;margin:10px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd6df;border-radius:8px;background:white;font:inherit;color:var(--ink)}textarea{min-height:75px;resize:vertical}.wide{grid-column:1/-1}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.danger{background:#fae9e9;color:var(--red)}.good{color:var(--green)}.warn{color:var(--amber)}.tag{display:inline-block;padding:3px 7px;border-radius:20px;background:#edf2f6;font-size:11px;font-weight:700;margin:2px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar input{max-width:320px}.hidden{display:none!important}.notice{border-left:4px solid var(--amber);padding:10px 12px;background:#fff8e8;border-radius:5px;margin:12px 0;font-size:13px}.small{font-size:12px}footer{text-align:center;color:#718091;padding:22px;font-size:12px}@media(min-width:750px){main{padding:24px}.formcard{max-width:100%}}
</style></head><body>
<header><h1>SiFa Manager</h1><small>Arbeitsschutz organisieren · dokumentieren · verbessern</small></header>
<nav id="nav"></nav><main><section id="dashboard" class="panel active"></section><div id="panels"></div></main><footer>SiFa Manager · lokale Arbeitsversion · fachliche Prüfung und betriebliche Anpassung erforderlich.</footer>
<script>
const modules=[
{id:'gb',tab:'Gefährdungsbeurteilung',title:'Gefährdungsbeurteilungen',desc:'Arbeitsbereiche, Tätigkeiten, Gefährdungen und Schutzmaßnahmen nach TOP.',fields:[['bereich','Arbeitsbereich / Tätigkeit','text',1],['gefahr','Gefährdung / Belastung','textarea',1],['folgen','Mögliche Folgen','textarea'],['exposition','Betroffene Personen / Exposition','textarea'],['technik','Technische Maßnahmen','textarea'],['orga','Organisatorische Maßnahmen','textarea'],['pers','Personenbezogene Maßnahmen / PSA','textarea'],['restrisiko','Restrisiko / Bewertung nach Maßnahmen','textarea'],['owner','Verantwortlich','text'],['termin','Termin / nächste Überprüfung','date']]},
{id:'mass',tab:'Maßnahmen',title:'Maßnahmenmanagement',desc:'Maßnahmen mit Zuständigkeit, Frist, Status und Wirksamkeitskontrolle.',fields:[['name','Maßnahme','textarea',1],['quelle','Quelle / Bezug (z. B. GB, Begehung)','text'],['art','Maßnahmenart','select',['Technisch','Organisatorisch','Personenbezogen']],['prio','Priorität','select',['Hoch','Mittel','Niedrig']],['owner','Verantwortlich','text'],['due','Fällig am','date'],['status','Status','select',['Offen','In Bearbeitung','Umgesetzt','Wirksamkeit zu prüfen','Abgeschlossen']],['wirkung','Wirksamkeitskontrolle / Ergebnis','textarea']]},
{id:'begeh',tab:'Begehungen',title:'Betriebsbegehungen und Mängel',desc:'Feststellungen erfassen und bei Bedarf unmittelbar in Maßnahmen übernehmen.',fields:[['date','Datum','date'],['bereich','Bereich / Standort','text',1],['fest','Feststellung / Mangel','textarea',1],['risiko','Risiko / mögliche Folgen','textarea'],['sofort','Sofortmaßnahme','textarea'],['owner','Verantwortlich','text'],['due','Frist','date'],['status','Status','select',['Offen','In Bearbeitung','Behoben']]]},
{id:'stoff',tab:'Gefahrstoffe',title:'Gefahrstoffmanagement',desc:'Gefahrstoffverzeichnis, SDB-Prüfung, Lagerung und Schutzmaßnahmen.',fields:[['name','Produkt / Gefahrstoff','text',1],['hersteller','Hersteller / Lieferant','text'],['hazard','Gefahren / H-Sätze','textarea'],['place','Lager- / Einsatzort','text'],['sdb','Sicherheitsdatenblatt geprüft am','date'],['sub','Substitutionsprüfung / Ergebnis','textarea'],['schutz','Schutzmaßnahmen / PSA / Lüftung','textarea'],['betran','Betriebsanweisung vorhanden?','select',['Ja','Nein','In Prüfung']]]},
{id:'mittel',tab:'Arbeitsmittel',title:'Arbeitsmittel und Maschinen',desc:'Inventar, sichere Verwendung, Schutzvorrichtungen und Verantwortlichkeiten.',fields:[['name','Arbeitsmittel / Maschine','text',1],['inventar','Inventar-/Seriennummer','text'],['place','Standort','text'],['hersteller','Hersteller / Baujahr / Herkunft','text'],['konform','CE / Konformitätsunterlagen geprüft','select',['Ja','Nein','Nicht zutreffend','Offen']],['schutz','Schutzeinrichtungen / sichere Bedienung','textarea'],['gb','Gefährdungsbeurteilung vorhanden','select',['Ja','Nein','In Bearbeitung']],['wartung','Wartung / Instandhaltung','textarea'],['hinweis','Mängel / Hinweise','textarea']]},
{id:'pruef',tab:'Prüfkataster',title:'Prüfkataster und Wartung',desc:'Prüfgegenstände, Prüfumfang, befähigte Personen und nächste Termine.',fields:[['name','Prüfgegenstand','text',1],['art','Prüfung / Prüfumfang','text'],['ort','Standort / Inventarnummer','text'],['intervall','Prüffrist / Intervall','text'],['last','Letzte Prüfung','date'],['date','Nächste Prüfung','date'],['person','Prüfer / befähigte Person','text'],['result','Ergebnis / Mängel','textarea'],['status','Status','select',['Geplant','Bestanden','Mängel – Nachprüfung','Überfällig']]]},
{id:'unter',tab:'Unterweisungen',title:'Unterweisungen und Qualifikationen',desc:'Themen, Zielgruppen, Termine und Nachweise.',fields:[['name','Thema','text',1],['group','Zielgruppe / Beschäftigte','text'],['basis','Anlass / Rechts- oder Betriebsgrundlage','text'],['date','Termin','date'],['person','Unterweisende Person','text'],['nachweis','Nachweis / Ablageort','text'],['status','Status','select',['Geplant','Durchgeführt','Nachweis fehlt']]]},
{id:'ereignis',tab:'Unfälle',title:'Unfälle und Beinaheunfälle',desc:'Ereignisse dokumentieren, Ursachen untersuchen und Prävention ableiten.',fields:[['date','Datum / Uhrzeit','date'],['type','Ereignisart','select',['Arbeitsunfall','Wegeunfall','Beinaheunfall','Unsicherer Zustand']],['place','Ort / Tätigkeit','text'],['desc','Ereignisbeschreibung','textarea',1],['impact','Verletzung / mögliche Folgen','textarea'],['cause','Ermittelte Ursachen','textarea'],['action','Sofort- und Präventionsmaßnahmen','textarea'],['report','Meldung / Dokumentation','text']]},
{id:'brand',tab:'Brandschutz & Notfall',title:'Brandschutz und Notfallorganisation',desc:'Brandschutzorganisation, Fluchtwege, Feuerlöscher, Erste Hilfe und Alarmierung.',fields:[['topic','Thema / Einrichtung','select',['Feuerlöscher','Brandschutzhelfer','Flucht- und Rettungsweg','Sammelstelle','Erste-Hilfe-Einrichtung','Alarmierung / Notfallplan','Brandlast / Lagerung','Sonstiges']],['place','Standort / Bereich','text',1],['state','Zustand / Feststellung','textarea'],['owner','Verantwortlich','text'],['date','Prüf-/Kontrolltermin','date'],['action','Handlungsbedarf','textarea']]},
{id:'vorsorge',tab:'Arbeitsmedizin & Ergonomie',title:'Arbeitsmedizin, Ergonomie und Belastungen',desc:'Vorsorgeanlässe organisatorisch im Blick behalten sowie Belastungen und Verbesserungen dokumentieren.',fields:[['bereich','Arbeitsbereich / Tätigkeit','text',1],['belastung','Belastung (physisch, psychisch, Umgebung)','textarea'],['vorsorge','Vorsorgeanlass / Angebotsorganisation','textarea'],['ergonomie','Ergonomische Maßnahmen','textarea'],['owner','Verantwortlich','text'],['date','Überprüfungstermin','date']]},
{id:'orga',tab:'Organisation',title:'Arbeitsschutzorganisation',desc:'Zuständigkeiten, Regelkommunikation und zentrale Organisationsfragen.',fields:[['topic','Organisationsthema','select',['Verantwortung und Pflichtenübertragung','Fachkraft für Arbeitssicherheit / Betriebsarzt','Arbeitsschutzausschuss','Erste Hilfe','Brandschutzorganisation','Fremdfirmenkoordination','Arbeitsmedizinische Vorsorge','Regelwerke und Dokumentation','Wirksamkeitskontrolle','Sonstiges']],['state','Ist-Stand / Regelung','textarea',1],['gap','Handlungsbedarf','textarea'],['owner','Verantwortlich','text'],['date','Überprüfungstermin','date']]},
{id:'termine',tab:'Termine',title:'Fristen und Termine',desc:'Allgemeine Wiedervorlagen, Begehungen, Sitzungen und Projekttermine.',fields:[['name','Termin / Aufgabe','text',1],['date','Fällig am','date',1],['owner','Verantwortlich','text'],['type','Kategorie','select',['Prüfung','Unterweisung','Begehung','ASA / Sitzung','Wiedervorlage','Sonstiges']],['status','Status','select',['Offen','Erledigt']],['note','Notiz','textarea']]}
];
const legacy=['gb','mass','stoff','mittel','pruef','unter'];const read=k=>JSON.parse(localStorage.getItem('sifa_'+k)||'[]');const write=(k,v)=>localStorage.setItem('sifa_'+k,JSON.stringify(v));
const nav=document.getElementById('nav'),panels=document.getElementById('panels');
function activate(id){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===id));}
nav.innerHTML='<button class="active" data-tab="dashboard">Übersicht</button>'+modules.map(m=>`<button data-tab="${m.id}">${m.tab}</button>`).join('')+'<button data-tab="reports">Berichte & Daten</button>';
nav.addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)activate(b.dataset.tab)});
function fieldHTML(f){let [key,label,type,required,opts]=f;let req=required===1?'required':'';if(type==='textarea')return `<div class="wide"><label>${label}</label><textarea name="${key}" ${req}></textarea></div>`;if(type==='select')return `<div><label>${label}</label><select name="${key}" ${req}>${(required instanceof Array?required:opts||[]).map(x=>`<option>${x}</option>`).join('')}</select></div>`;return `<div><label>${label}</label><input name="${key}" type="${type}" ${req}></div>`}
modules.forEach(m=>{let sec=document.createElement('section');sec.id=m.id;sec.className='panel';sec.innerHTML=`<h2>${m.title}</h2><p class="muted">${m.desc}</p><div class="card formcard"><form id="form-${m.id}"><div class="formgrid">${m.fields.map(fieldHTML).join('')}</div><div class="btnrow"><button class="btn primary">Eintrag speichern</button><button type="reset" class="btn">Eingaben zurücksetzen</button></div></form></div><div class="toolbar" style="margin-top:15px"><input id="search-${m.id}" placeholder="Einträge durchsuchen …"><span class="muted" id="count-${m.id}"></span></div><div id="list-${m.id}" class="card"></div>`;panels.appendChild(sec);
let form=sec.querySelector('form');form.addEventListener('submit',e=>{e.preventDefault();let o=Object.fromEntries(new FormData(form));o.created=new Date().toISOString();let a=read(m.id);a.unshift(o);write(m.id,a);form.reset();render(m.id);dashboard()});sec.querySelector('input[type=search],input[id^=search]').addEventListener('input',()=>render(m.id));});
let report=document.createElement('section');report.id='reports';report.className='panel';report.innerHTML=`<h2>Berichte und Datensicherung</h2><div class="grid"><div class="card"><h3>Gesamtübersicht exportieren</h3><p class="muted">Alle erfassten Module als JSON-Datei sichern.</p><button class="btn primary" id="export">Datensicherung exportieren</button></div><div class="card"><h3>Datensicherung importieren</h3><p class="muted">Eine zuvor exportierte SiFa-Manager-Datei wiederherstellen. Vorher aktuelle Daten sichern.</p><input id="importFile" type="file" accept="application/json"></div><div class="card"><h3>Bericht drucken</h3><p class="muted">Druckansicht der erfassten Daten öffnen und im Druckdialog als PDF speichern.</p><button class="btn" id="print">Übersicht drucken / PDF</button></div></div><div class="notice"><b>Datenschutz:</b> Die Daten werden in diesem Browser auf diesem Gerät gespeichert. GitHub Pages stellt den Programmcode bereit, synchronisiert aber keine Einträge. Keine personenbezogenen oder vertraulichen Betriebsdaten in fremden oder gemeinsam genutzten Geräten erfassen. Regelmäßig exportieren und sicher aufbewahren.</div><div class="notice"><b>Fachlicher Hinweis:</b> Die App unterstützt die Dokumentation. Sie ersetzt weder die konkrete Gefährdungsbeurteilung noch die Prüfung, ob Rechtsvorschriften, Prüffristen oder Maßnahmen im Einzelfall zutreffend festgelegt wurden.</div>`;panels.appendChild(report);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(id){let m=modules.find(x=>x.id===id),a=read(id),q=(document.getElementById('search-'+id)?.value||'').toLowerCase();let filtered=a.map((o,i)=>({...o,_i:i})).filter(o=>Object.values(o).join(' ').toLowerCase().includes(q));document.getElementById('count-'+id).textContent=`${a.length} Einträge`;let el=document.getElementById('list-'+id);el.innerHTML=filtered.length?filtered.map(o=>`<div class="item"><b>${esc(o.name||o.bereich||o.topic||o.fest||o.desc||'Eintrag')}</b><div>${m.fields.map(f=>{let v=o[f[0]];return v?`<div class="small"><b>${esc(f[1])}:</b> ${esc(v)}</div>`:''}).join('')}</div><div class="btnrow"><button class="btn danger" data-delete="${id}" data-i="${o._i}">Eintrag löschen</button></div></div>`).join(''):'<p class="muted">Noch keine passenden Einträge vorhanden.</p>';el.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Diesen Eintrag wirklich löschen?')){let arr=read(id);arr.splice(+b.dataset.i,1);write(id,arr);render(id);dashboard()}})}
function allCount(){return modules.reduce((n,m)=>n+read(m.id).length,0)}
function dashboard(){let open=read('mass').filter(x=>!['Abgeschlossen','Umgesetzt'].includes(x.status)).length;let overdue=0;let today=new Date().toISOString().slice(0,10);['pruef','termine','unter','begeh'].forEach(k=>read(k).forEach(x=>{let d=x.date||x.due;if(d&&d<today&&x.status!=='Erledigt'&&x.status!=='Durchgeführt'&&x.status!=='Bestanden'&&x.status!=='Behoben')overdue++}));let metrics=[['Erfasste Datensätze',allCount()],['Offene Maßnahmen',open],['Überfällige Termine (indikativ)',overdue],['Gefährdungsbeurteilungen',read('gb').length],['Arbeitsmittel',read('mittel').length],['Gefahrstoffe',read('stoff').length]];document.getElementById('dashboard').innerHTML=`<h2>Dashboard</h2><div class="grid">${metrics.map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('')}</div><div class="grid" style="margin-top:14px"><div class="card"><h3>Handlungsbedarf</h3><p class="muted">Prüfe regelmäßig offene Maßnahmen, anstehende Fristen und die Wirksamkeit umgesetzter Schutzmaßnahmen.</p><button class="btn" onclick="activate('mass')">Maßnahmen öffnen</button></div><div class="card"><h3>Systemstatus</h3><p class="muted">Lokale Speicherung · JSON-Sicherung · Druck-/PDF-Ausgabe</p><span class="tag">Arbeitsversion</span><span class="tag">Offline nach Erstaufruf*</span><p class="small muted">*Wenn die PWA-Dateien korrekt veröffentlicht und der Service Worker installiert wurden.</p></div></div><h3 style="margin-top:18px">Module</h3><div class="grid">${modules.map(m=>`<div class="card"><b>${m.tab}</b><div class="metric">${read(m.id).length}</div><button class="btn" onclick="activate('${m.id}')">Öffnen</button></div>`).join('')}</div>`}
window.activate=activate;
document.getElementById('export').onclick=()=>{let data={app:'SiFa Manager',version:2,exportiert:new Date().toISOString(),daten:Object.fromEntries(modules.map(m=>[m.id,read(m.id)]))};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sifa-manager-sicherung-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
document.getElementById('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text()),src=d.daten||d;if(!confirm('Import kann vorhandene Einträge der enthaltenen Module ersetzen. Fortfahren?'))return;modules.forEach(m=>{if(Array.isArray(src[m.id]))write(m.id,src[m.id])});modules.forEach(m=>render(m.id));dashboard();alert('Datensicherung importiert.')}catch(err){alert('Datei konnte nicht gelesen werden.')}};
document.getElementById('print').onclick=()=>window.print();
modules.forEach(m=>render(m.id));dashboard();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
